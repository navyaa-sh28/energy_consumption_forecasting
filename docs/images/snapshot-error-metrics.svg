<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#09141d"/>
      <stop offset="100%" stop-color="#030c12"/>
    </linearGradient>
    <linearGradient id="head" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1c2734"/>
      <stop offset="100%" stop-color="#101b28"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0%" stop-color="#a6d9f8"/>
      <stop offset="100%" stop-color="#6bbbe9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="520" y="120" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="56" font-weight="800">Full test-set results from the notebook</text>

  <rect x="410" y="175" width="780" height="260" rx="8" fill="#101922" stroke="#2d3d4d"/>
  <rect x="410" y="175" width="780" height="46" fill="url(#head)"/>
  <g font-family="Segoe UI, sans-serif" font-size="18" fill="#dfeaf5">
    <text x="455" y="205">Model</text>
    <text x="650" y="205">MAE</text>
    <text x="790" y="205">RMSE</text>
    <text x="940" y="205">MAPE %</text>
  </g>

  <g font-family="Segoe UI, sans-serif" font-size="18" fill="#f8fafc">
    <text x="455" y="270">Baseline: same hour last week</text>
    <text x="660" y="270">1163.47</text>
    <text x="800" y="270">1745.25</text>
    <text x="955" y="270">9.89</text>

    <text x="455" y="320">XGBoost (no weather)</text>
    <text x="660" y="320">399.86</text>
    <text x="800" y="320">579.01</text>
    <text x="955" y="320">3.43</text>

    <text x="455" y="370">XGBoost (with weather)</text>
    <text x="660" y="370">345.63</text>
    <text x="800" y="370">518.08</text>
    <text x="955" y="370">2.97</text>
  </g>

  <g transform="translate(410,475)">
    <text x="60" y="35" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700">Chart metric</text>
    <rect x="60" y="62" width="220" height="40" rx="6" fill="#1d2a36"/>
    <text x="90" y="88" fill="#dfeaf5" font-family="Segoe UI, sans-serif" font-size="18">MAPE %</text>

    <g transform="translate(140,135)">
      <line x1="0" y1="260" x2="760" y2="260" stroke="#48586e"/>
      <line x1="0" y1="0" x2="0" y2="260" stroke="#48586e"/>

      <g font-family="Segoe UI, sans-serif" font-size="17" fill="#dfeaf5">
        <text x="-10" y="245">0</text>
        <text x="150" y="245">2</text>
        <text x="300" y="245">4</text>
        <text x="450" y="245">6</text>
        <text x="600" y="245">8</text>
        <text x="720" y="245">10</text>
      </g>

      <rect x="30" y="120" width="110" height="140" fill="url(#bar)" opacity="0.9"/>
      <rect x="200" y="95" width="110" height="165" fill="url(#bar)" opacity="0.8"/>
      <rect x="370" y="82" width="110" height="178" fill="url(#bar)" opacity="0.72"/>
      <rect x="540" y="58" width="110" height="202" fill="url(#bar)" opacity="0.88"/>
      <rect x="660" y="42" width="90" height="218" fill="url(#bar)" opacity="0.96"/>
    </g>
  </g>
</svg>




















































































