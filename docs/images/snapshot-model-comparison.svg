<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#07111b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#1a2331"/>
      <stop offset="100%" stop-color="#101b27"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="330" height="900" fill="#1a212d"/>
  <rect x="330" y="0" width="1270" height="900" fill="#07141d"/>

  <text x="46" y="92" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">Controls</text>
  <text x="46" y="170" fill="#dfe7f0" font-family="Segoe UI, sans-serif" font-size="22">Start date</text>
  <rect x="46" y="195" width="220" height="52" rx="8" fill="#161f2c" stroke="#2d3e53"/>
  <text x="68" y="230" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="20">2017/01/01</text>

  <text x="46" y="305" fill="#dfe7f0" font-family="Segoe UI, sans-serif" font-size="22">Window</text>
  <g transform="translate(46,334)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#f1f5f9" stroke-width="2"/>
    <text x="34" y="18" fill="#edf2f7" font-family="Segoe UI, sans-serif" font-size="18">24 hours</text>
  </g>
  <g transform="translate(46,380)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#f1f5f9" stroke-width="2"/>
