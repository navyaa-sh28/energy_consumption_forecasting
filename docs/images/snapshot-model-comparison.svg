    <text x="34" y="18" fill="#edf2f7" font-family="Segoe UI, sans-serif" font-size="18">30 days</text>
  </g>

  <text x="46" y="563" fill="#dfe7f0" font-family="Segoe UI, sans-serif" font-size="22">Models to show</text>
  <g transform="translate(46,595)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="#d14f46"/>
    <text x="18" y="30" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="19">Baseline (same hour la...</text>
    <text x="190" y="29" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="18">×</text>
  </g>
  <g transform="translate(46,650)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="#d14f46" opacity="0.9"/>
    <text x="18" y="30" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="19">XGBoost (no weather)</text>
    <text x="190" y="29" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="18">×</text>
  </g>
  <g transform="translate(46,705)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="#d14f46" opacity="0.8"/>
    <text x="18" y="30" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="19">XGBoost (with weather)</text>
    <text x="190" y="29" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="18">×</text>
  </g>

  <text x="480" y="90" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="56" font-weight="800">Electricity Load Forecasting</text>
  <text x="495" y="145" fill="#dfe7f0" font-family="Segoe UI, sans-serif" font-size="22">Hourly grid load (MW) forecast with time-series ML: baseline vs XGBoost, with and without weather.</text>

  <rect x="480" y="175" width="980" height="82" rx="9" fill="#123b5d"/>
  <text x="510" y="228" fill="#dfeeff" font-family="Segoe UI, sans-serif" font-size="19">Backtest mode. This app shows predictions on a held-out test period (2017-01-01 to 2018-08-03) that the models never saw during training. The data is historical (PJM dataset, ends around 2018), so this is a demonstration of forecast quality, not a live forecast. Scope: electricity demand only.</text>

  <g transform="translate(500,285)">
    <text x="0" y="28" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Forecast</text>
    <rect x="110" y="8" width="100" height="2" fill="#f59e0b"/>
    <text x="145" y="28" fill="#dfeaf5" font-family="Segoe UI, sans-serif" font-size="22">Model comparison</text>
    <text x="350" y="28" fill="#dfeaf5" font-family="Segoe UI, sans-serif" font-size="22">About</text>
  </g>

  <g transform="translate(500,335)">
