      <text x="0" y="120">14k</text>
      <text x="0" y="255">13k</text>
      <text x="0" y="390">12k</text>
      <text x="0" y="525">11k</text>
      <text x="0" y="660">10k</text>
      <text x="0" y="795">9k</text>
    </g>
  </g>

