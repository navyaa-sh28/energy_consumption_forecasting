# Electricity Load Forecasting

[![Streamlit](https://img.shields.io/badge/Streamlit-App-orange)](https://energyconsumptionforecasting-3abkbqypyaj6zna7ltvq5s.streamlit.app/)
[![Python](https://img.shields.io/badge/Python-3.8%2B-blue.svg)](https://www.python.org/)
[![License](https://img.shields.io/badge/license-MIT-green.svg)](LICENSE)
[![Repo Size](https://img.shields.io/github/repo-size/navyaa-sh28/energy_consumption_forecasting)](https://github.com/navyaa-sh28/energy_consumption_forecasting)

A polished end-to-end project for hourly electricity demand forecasting using time-series machine learning. The repository compares baseline methods with XGBoost models, evaluates forecast quality on a held-out test window, and packages the results in a Streamlit dashboard.

## Live demo

Try the app here:

https://energyconsumptionforecasting-3abkbqypyaj6zna7ltvq5s.streamlit.app/

