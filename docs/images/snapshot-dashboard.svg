## Quickstart

### 1) Clone the repository

```bash
git clone https://github.com/navyaa-sh28/energy_consumption_forecasting.git
cd energy_consumption_forecasting
```

### 2) Install dependencies

```bash
python -m venv .venv
source .venv/bin/activate   # macOS / Linux
# or on Windows:
# .venv\Scripts\activate
pip install -r requirements.txt
```

### 3) Run the app

```bash
streamlit run app.py
```

## Data

This project uses the hourly electricity consumption dataset from Kaggle:

https://www.kaggle.com/datasets/robikscube/hourly-energy-consumption

The app uses historical demand data and compares model outputs across time windows.

## Model strategy

The forecasting workflow includes:

- Baseline: same hour from the previous week
- XGBoost without weather features
- XGBoost with weather features
- Evaluation using MAE, RMSE, and MAPE

## Results summary

The dashboard highlights the following patterns:

- Weather-aware XGBoost yields the strongest performance
- Baseline methods are useful as a benchmark
- Errors decrease significantly when weather effects are included

