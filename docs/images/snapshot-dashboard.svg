## Why this project

- Real-world hourly electricity load forecasting using the PJM dataset
- Baseline vs XGBoost model comparison
- Weather-aware and non-weather-aware forecasting variants
- Clean time-window filtering and evaluation workflow
- Streamlit app for exploration and reporting

## Architecture

```mermaid
flowchart LR
    A[Hourly energy load data\nPJM / Kaggle] --> B[Data ingestion and validation]
    C[Weather data\noptional] --> D[Feature engineering]
    B --> D
    D --> E[Train/test split]
    E --> F[Baseline models]
    E --> G[XGBoost models]
    F --> H[Backtest evaluation]
    G --> H
    H --> I[Metrics: MAE, RMSE, MAPE]
    H --> J[Predictions artifact]
    I --> K[Streamlit dashboard]
    J --> K
    K --> L[Forecast charts and error tables]
```

